<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Monthsary, Mahal! ❤️</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff4d6d;
      --secondary: #ff758f;
      --accent-glow: rgba(255, 77, 109, 0.6);
      --bg: #060609;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    #fireworks-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 90%;
      text-align: center;
      padding: 40px 25px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 25px var(--accent-glow);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .badge {
      display: inline-block;
      padding: 6px 18px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 50px;
      background: rgba(255, 77, 109, 0.15);
      border: 1px solid var(--primary);
      color: var(--secondary);
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.4rem;
      color: #fff;
      text-shadow: 0 0 15px var(--primary), 0 0 35px var(--primary);
      margin-bottom: 10px;
      line-height: 1.2;
    }

    p.subtitle {
      font-size: 1rem;
      color: #cfcfe0;
      margin-bottom: 25px;
      font-weight: 300;
    }

    .counter-box {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.55);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 25px;
    }

    .counter-item h3 {
      font-size: 1.8rem;
      color: var(--secondary);
      font-weight: 600;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .counter-item p {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0a0b0;
    }

    .hint-text {
      font-size: 0.85rem;
      color: #b0b0c5;
      margin-bottom: 20px;
      font-style: italic;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--primary), #ff8fa3);
      color: #fff;
      box-shadow: 0 4px 20px rgba(255, 77, 109, 0.5);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 77, 109, 0.8);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #11111a;
      border: 1px solid var(--primary);
      border-radius: 20px;
      width: 90%;
      max-width: 480px;
      padding: 30px 25px;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 35px var(--accent-glow);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.3rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .modal-card p {
      color: #e0e0e0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 14px;
      border-radius: 8px;
      color: white;
      font-family: inherit;
      outline: none;
    }

    .close-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="fireworks-canvas"></canvas>

  <div class="container">
    <div class="badge" id="coupleBadge">Celebrating Us 🐾</div>
    <h1 id="headline">Happy Monthsary!</h1>
    <p class="subtitle" id="subtitle">Every second with you is magic.</p>

    <!-- Days Counter -->
    <div class="counter-box">
      <div class="counter-item">
        <h3 id="days-count">0</h3>
        <p>Days</p>
      </div>
      <div class="counter-item">
        <h3 id="hours-count">0</h3>
        <p>Hours</p>
      </div>
      <div class="counter-item">
        <h3 id="minutes-count">0</h3>
        <p>Minutes</p>
      </div>
    </div>

    <p class="hint-text">✨ Tap anywhere for colorful paw fireworks 🐾✨</p>

    <div class="btn-group">
      <button class="btn btn-primary" id="openMessageBtn">Read Love Letter 💌</button>
      <button class="btn btn-secondary" id="randomQuoteBtn">Sweet Note 💖</button>
      <button class="btn btn-secondary" id="openFormBtn">Leave a Note ✍️</button>
    </div>
  </div>

  <!-- Popup Modal (Message Display) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 id="modalTitle">My Dearest Love ❤️</h2>
      <p id="modalBody">Loading message...</p>
      <button class="close-btn" id="closeModalBtn">Close</button>
    </div>
  </div>

  <!-- Popup Modal (Leave a note) -->
  <div class="modal-overlay" id="formModalOverlay">
    <div class="modal-card">
      <h2>Send a Sweet Note 💌</h2>
      <div class="form-group">
        <input type="text" id="authorInput" placeholder="Your Name or Nickname" />
      </div>
      <div class="form-group">
        <textarea id="messageInput" rows="3" placeholder="Write your sweet message here..."></textarea>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn btn-primary" id="submitNoteBtn">Send</button>
        <button class="close-btn" id="closeFormBtn" style="background: rgba(255,255,255,0.1);">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. PAW-SHAPED FIREWORKS ENGINE 🐾 (Fast & Lag-Free)
       ========================================================== */
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const MAX_PARTICLES = 250;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const vibrantColors = [
      '#ff007f', '#ff3366', '#00f0ff', '#70d6ff', 
      '#b5179e', '#f72585', '#ffd166', '#39ff14', '#ffffff'
    ];

    // Pre-calculated geometric vectors for a Paw Print 🐾
    const PAW_VECTORS = (() => {
      const pts = [];

      // 1. Large Main Center Pad (Heart / Rounded Bean)
      for (let a = 0; a < Math.PI * 2; a += 0.28) {
        pts.push({ x: Math.cos(a) * 0.55, y: Math.sin(a) * 0.42 + 0.25 });
      }
      // Inner fill for main pad
      pts.push({ x: 0, y: 0.25 }, { x: -0.2, y: 0.25 }, { x: 0.2, y: 0.25 });

      // Helper to generate the 4 Toe Pads
      function makeToe(cx, cy, rx, ry) {
        for (let a = 0; a < Math.PI * 2; a += 0.5) {
          pts.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, toe: true });
        }
        pts.push({ x: cx, y: cy, toe: true }); // toe center spark
      }

      makeToe(-0.62, -0.15, 0.18, 0.24); // Outer Left Toe
      makeToe(-0.25, -0.52, 0.20, 0.26); // Inner Left Toe
      makeToe(0.25, -0.52, 0.20, 0.26);  // Inner Right Toe
      makeToe(0.62, -0.15, 0.18, 0.24);  // Outer Right Toe

      return pts;
    })();

    class PawParticle {
      constructor(x, y, dx, dy, color, size) {
        this.x = x;
        this.y = y;
        const speed = 2.3;
        this.vx = dx * speed;
        this.vy = dy * speed;
        this.color = color;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.013;
        this.size = size;
      }

      update() {
        this.vx *= 0.97;
        this.vy *= 0.97;
        this.vy += 0.018; // slight gravity
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.globalAlpha = this.alpha > 0 ? this.alpha : 0;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, 6.283); // 2 * PI
        ctx.fill();
      }
    }

    function createPawFirework(originX, originY) {
      if (particles.length > MAX_PARTICLES) {
        particles.splice(0, 35); // prevent lag on spam clicking
      }

      const mainColor = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];
      const toeColor = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];

      for (let i = 0; i < PAW_VECTORS.length; i++) {
        const pt = PAW_VECTORS[i];
        const color = pt.toe ? toeColor : mainColor;
        const size = pt.toe ? 2.8 : 2.5;
        particles.push(new PawParticle(originX, originY, pt.x, pt.y, color, size));
      }
    }

    function animate() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(6, 6, 9, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'lighter';

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw();
        }
      }

      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('pointerdown', (e) => {
      if (!['BUTTON', 'INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
        createPawFirework(e.clientX, e.clientY);
      }
    });

    /* ==========================================================
       2. DATA & LIVE COUNTER
       ========================================================== */
    let startDate = new Date(2023, 0, 1);

    async function loadData() {
      try {
        const res = await fetch('/api/data');
        if (res.ok) {
          const data = await res.json();
          if (data.config) {
            document.getElementById('coupleBadge').innerText = `${data.config.partnerOne} & ${data.config.partnerTwo} 🐾`;
            if (data.config.startDate) startDate = new Date(data.config.startDate);
          }
        }
      } catch (err) {
        console.log("Offline mode active.");
      }
      setTimeout(() => {
        createPawFirework(window.innerWidth * 0.5, window.innerHeight * 0.35);
      }, 400);
    }
    loadData();

    function updateCounter() {
      const now = new Date();
      const diffTime = Math.abs(now - startDate);

      document.getElementById('days-count').innerText = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('hours-count').innerText = Math.floor((diffTime / (1000 * 60 * 60)) % 24);
      document.getElementById('minutes-count').innerText = Math.floor((diffTime / (1000 * 60)) % 60);
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    /* ==========================================================
       3. MODALS & DISCORD WEBHOOK
       ========================================================== */
    const modal = document.getElementById('modalOverlay');
    const formModal = document.getElementById('formModalOverlay');

    document.getElementById('openMessageBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').innerText = `To My Favorite Person ❤️`;
      document.getElementById('modalBody').innerText = "Thank you for all the laughter, sweet hugs, and beautiful memories. Happy Monthsary, Mahal! 🌸";
      modal.classList.add('active');
      createPawFirework(window.innerWidth / 2, window.innerHeight / 2);
    });

    const sweetNotes = [
      "I fall in love with you more and more every single day. 💕",
      "You are my favorite place to go when my mind searches for peace. 🌸",
      "Thank you for being my rock, my best friend, and my greatest love. ✨",
      "Loving you is the easiest and best thing I've ever done. 🐾❤️"
    ];

    document.getElementById('randomQuoteBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').innerText = `Sweet Reminder 💌`;
      document.getElementById('modalBody').innerText = sweetNotes[Math.floor(Math.random() * sweetNotes.length)];
      modal.classList.add('active');
      createPawFirework(window.innerWidth / 2, window.innerHeight / 2);
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('active'));
    document.getElementById('openFormBtn').addEventListener('click', () => formModal.classList.add('active'));
    document.getElementById('closeFormBtn').addEventListener('click', () => formModal.classList.remove('active'));

    document.getElementById('submitNoteBtn').addEventListener('click', async () => {
      const author = document.getElementById('authorInput').value;
      const text = document.getElementById('messageInput').value;

      if (!text.trim()) return alert("Please enter a note!");

      const WEBHOOK_URL = "https://discord.com/api/webhooks/1544144774079062066/SWU7-SXUcFwXUpDmms-Z5uYZMHbPqj3nH-8mzbErHDz_32W8og6Z4Yw_Mt8UyIHka9Vr";

      const payload = {
        username: "Monthsary Bot 💕",
        avatar_url: "https://cdn-icons-png.flaticon.com/512/833/833472.png",
        embeds: [{
          title: "💌 New Love Note Received!",
          color: 16731501,
          fields: [
            { name: "👤 From:", value: `**${author.trim() || 'My Sweetheart'}**`, inline: true },
            { name: "💬 Message:", value: text.trim(), inline: false }
          ],
          footer: { text: "Happy Monthsary ✨" },
          timestamp: new Date().toISOString()
        }]
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById('messageInput').value = '';
          formModal.classList.remove('active');
          createPawFirework(window.innerWidth / 2, window.innerHeight / 2);
          alert("Love note sent to Discord! ❤️");
        } else {
          alert("Discord rejected the webhook. Please check the URL.");
        }
      } catch (err) {
        alert("Failed to send to Discord.");
      }
    });
  </script>
</body>
</html>
